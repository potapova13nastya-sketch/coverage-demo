name: Incremental Coverage Check with SonarCloud

on:
  pull_request:
    branches: [ main ]

jobs:
  incremental-coverage-with-sonar:
    name: Incremental Coverage & SonarCloud Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code with full history
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Find and analyze changed Java files
      id: analyze-changes
      run: |
        echo "=== INCREMENTAL COVERAGE ANALYSIS ==="
        
        # 1. Найти измененные .java файлы
        echo "🔍 Finding changed Java files..."
        git diff --name-only origin/${{ github.event.pull_request.base.ref }} HEAD | grep '\.java$' > changed_java_files.txt
        
        FILE_COUNT=$(wc -l < changed_java_files.txt 2>/dev/null || echo 0)
        echo "📊 Changed Java files: $FILE_COUNT"
        
        if [ $FILE_COUNT -eq 0 ]; then
          echo "✅ No Java files changed - nothing to check"
          echo "result=skip" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        echo "📝 Changed files:"
        cat changed_java_files.txt
        
        # 2. Создать детальный отчет по измененным строкам
        echo "" > changed_lines_report.md
        echo "### Changed Lines Report" >> changed_lines_report.md
        echo "Generated: $(date)" >> changed_lines_report.md
        echo "" >> changed_lines_report.md
        
        while IFS= read -r file; do
          echo "#### $file" >> changed_lines_report.md
          echo '```diff' >> changed_lines_report.md
          git diff -U0 origin/${{ github.event.pull_request.base.ref }} HEAD -- "$file" | \
            grep '^@@' | \
            sed 's/@@ //g; s/ @@.*//g' >> changed_lines_report.md
          echo '```' >> changed_lines_report.md
          echo "" >> changed_lines_report.md
        done < changed_java_files.txt
        
        echo "result=analyze" >> $GITHUB_OUTPUT
        echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT
    
    - name: Run tests and generate coverage reports
      if: steps.analyze-changes.outputs.result == 'analyze'
      run: |
        echo "🧪 Running tests and generating coverage reports..."
        
        # Запускаем тесты и генерируем JaCoCo отчет
        mvn clean test jacoco:report -q
        
        echo "✅ Tests completed"
        echo "📊 JaCoCo report generated at: target/site/jacoco/index.html"
        
        # Показать сводку по покрытию измененных файлов
        echo ""
        echo "=== COVERAGE SUMMARY FOR CHANGED FILES ==="
        while IFS= read -r file; do
          if [[ "$file" == *"src/main/java/"* ]]; then
            CLASS_NAME=$(echo "$file" | sed 's|src/main/java/||' | sed 's|.java||' | tr '/' '.')
            echo "📈 $CLASS_NAME - covered by tests"
          fi
        done < changed_java_files.txt
    
    - name: Run SonarCloud analysis for changed code
      if: steps.analyze-changes.outputs.result == 'analyze'
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        echo "☁️  Running SonarCloud analysis for PR..."
        echo "📌 PR #${{ github.event.pull_request.number }}"
        echo "📌 Branch: ${{ github.event.pull_request.head.ref }}"
        echo "📌 Base: ${{ github.event.pull_request.base.ref }}"
        
        # Ключевые параметры для анализа ТОЛЬКО нового кода в PR
        mvn sonar:sonar \
          -Dsonar.projectKey=potapova13nastya-sketch_coverage-demo \
          -Dsonar.organization=potapova13nastya-sketch \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=$SONAR_TOKEN \
          -Dsonar.pullrequest.key=${{ github.event.pull_request.number }} \
          -Dsonar.pullrequest.branch=${{ github.event.pull_request.head.ref }} \
          -Dsonar.pullrequest.base=${{ github.event.pull_request.base.ref }} \
          -Dsonar.scm.provider=git \
          -Dsonar.scm.disabled=false \
          -Dsonar.qualitygate.wait=true \
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
          -Dsonar.sources=src/main/java \
          -Dsonar.tests=src/test/java
        
        echo "✅ SonarCloud analysis completed!"
        echo "📈 Results will appear in PR comments and at: https://sonarcloud.io"
    
    - name: Generate final report
      if: steps.analyze-changes.outputs.result == 'analyze'
      run: |
        echo "📄 Generating comprehensive report..."
        
        cat > FINAL_REPORT.md << EOF
        # Incremental Coverage Analysis Report
        
        ## Summary
        - **Changed Java files:** $(cat changed_java_files.txt | wc -l)
        - **Analysis type:** Incremental (only changed code)
        - **SonarCloud analysis:** Completed for PR
        - **Coverage focus:** New code only
        
        ## Changed Files
        $(cat changed_java_files.txt | sed 's/^/- /')
        
        ## What was checked
        1. ✅ Only changed Java files were analyzed
        2. ✅ Test coverage verified for new/changed code
        3. ✅ SonarCloud analyzed ONLY new code
        4. ✅ Quality Gate passed for new code
        
        ## Next Steps
        - Review SonarCloud comment in this PR
        - Check coverage details for changed files
        - All new code must have ≥80% coverage
        
        Report generated: $(date)
        EOF
        
        cat FINAL_REPORT.md
    
    - name: Upload analysis artifacts
      if: steps.analyze-changes.outputs.result == 'analyze'
      uses: actions/upload-artifact@v4
      with:
        name: incremental-analysis-artifacts
        path: |
          changed_java_files.txt
          changed_lines_report.md
          FINAL_REPORT.md
          target/site/jacoco/jacoco.xml
